name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build and publish
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Plot v__VERSION__'
          releaseBody: |
            Windows için Plot masaüstü uygulaması.

            **Kurulum:** `Plot_..._x64-setup.exe` dosyasını indirip çalıştırın. WebView2 yoksa kurulum sırasında otomatik indirilir.

            **Kurulumsuz:** `Plot_..._x64_portable.zip` dosyasını indirip açın ve `Plot.exe` dosyasını çalıştırın.

            Veriler cihazda kalır (SQLite); hesap veya bulut gerekmez.
          releaseDraft: false
          prerelease: false
          args: '--bundles nsis'

      - name: Package portable exe
        shell: pwsh
        run: |
          $candidates = @(
            "src-tauri/target/release/plot.exe",
            "src-tauri/target/release/Plot.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "Portable exe bulunamadı: $($candidates -join ', ')" }
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item $exe portable/Plot.exe
          Compress-Archive -Path portable/Plot.exe -DestinationPath "Plot_${{ steps.tauri.outputs.appVersion }}_x64_portable.zip" -Force

      - name: Upload portable exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "app-v${{ steps.tauri.outputs.appVersion }}" "Plot_${{ steps.tauri.outputs.appVersion }}_x64_portable.zip" --clobber
